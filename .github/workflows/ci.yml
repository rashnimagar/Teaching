name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Production Deployment Checks
        env:
          SECRET_KEY: "ci-production-check-strong-random-secret-key-value-32chars"
          ALLOWED_HOSTS: "teaching.example.com"
          DATABASE_URL: "sqlite:///db.sqlite3"
          CACHE_URL: "dbcache://django_cache_table"
          DJANGO_ADMIN_URL: "secret-admin-portal/"
        run: |
          python manage.py check --deploy --settings=config.settings.prod --fail-level ERROR

      - name: Run Pytest
        env:
          SECRET_KEY: "ci-secret-key-not-for-production-use"
        run: |
          pytest
