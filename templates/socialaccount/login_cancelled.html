{% extends "base.html" %}

{% block title %}Sign In Cancelled — {{ site_settings.site_name }}{% endblock title %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">
      Sign In Cancelled
    </h1>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
      You cancelled the Google sign-in process before it was completed. No account was logged in.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white dark:bg-gray-900 py-8 px-6 shadow-sm border border-gray-100 dark:border-gray-800 rounded-2xl text-center sm:px-10">
      <a
        href="{% url 'account_login' %}"
        class="w-full inline-flex justify-center py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm transition-all"
      >
        Return to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock content %}
