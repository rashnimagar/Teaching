{% extends "base.html" %}

{% block title %}429 Too Many Requests — Teaching Platform{% endblock title %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 font-extrabold text-2xl mb-4">
      429
    </div>
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">
      Too Many Requests
    </h1>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
      You have submitted too many requests in a short period. Please wait a minute before attempting to log in again.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white dark:bg-gray-900 py-8 px-6 shadow-sm border border-gray-100 dark:border-gray-800 rounded-2xl text-center sm:px-10">
      <a
        href="{% url 'core:home' %}"
        class="w-full inline-flex justify-center py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm transition-all"
      >
        Return to Home
      </a>
    </div>
  </div>
</div>
{% endblock content %}
