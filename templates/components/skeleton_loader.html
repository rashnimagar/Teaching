{% comment %}
Reusable Skeleton Loader Component
Parameters:
  - type: "card" | "line" | "video" | "avatar" (default: "line")
  - count: integer (default: 1)
  - extra_classes: string
{% endcomment %}
<div class="animate-pulse space-y-3 w-full {% if extra_classes %}{{ extra_classes }}{% endif %}" aria-hidden="true">
  {% if type == 'card' %}
    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-4">
      <div class="h-40 bg-slate-200 dark:bg-slate-800 rounded-xl w-full"></div>
      <div class="h-5 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
      <div class="space-y-2">
        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div>
      </div>
      <div class="pt-2 flex justify-between items-center">
        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div>
        <div class="h-8 bg-slate-200 dark:bg-slate-800 rounded-lg w-1/3"></div>
      </div>
    </div>
  {% elif type == 'video' %}
    <div class="aspect-video bg-slate-200 dark:bg-slate-800 rounded-2xl w-full flex items-center justify-center">
      <svg class="w-12 h-12 text-slate-300 dark:text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  {% elif type == 'avatar' %}
    <div class="flex items-center space-x-3">
      <div class="rounded-full bg-slate-200 dark:bg-slate-800 h-10 w-10"></div>
      <div class="space-y-1.5 flex-1">
        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div>
        <div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div>
      </div>
    </div>
  {% else %}
    <div class="space-y-2.5">
      <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-2/3"></div>
    </div>
  {% endif %}
</div>
