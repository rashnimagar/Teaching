{% comment %}
Reusable Textarea Component
Parameters:
  - id: string
  - name: string
  - rows: integer (default: 4)
  - value: string
  - placeholder: string
  - required: boolean
  - disabled: boolean
  - error: string
  - help_text: string
  - extra_classes: string
{% endcomment %}
<textarea
  id="{{ id }}"
  name="{{ name }}"
  rows="{% if rows %}{{ rows }}{% else %}4{% endif %}"
  {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
  {% if required %}required{% endif %}
  {% if disabled %}disabled aria-disabled="true"{% endif %}
  {% if error %}
    aria-invalid="true"
    aria-describedby="{{ id }}-error{% if help_text %} {{ id }}-help{% endif %}"
  {% elif help_text %}
    aria-describedby="{{ id }}-help"
  {% endif %}
  class="w-full px-3.5 py-2.5 rounded-xl text-sm transition-all duration-150 outline-none shadow-sm
  bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500
  {% if error %}
    border-2 border-red-500 dark:border-red-500 focus:border-red-500 focus:ring-2 focus:ring-red-500/30
  {% else %}
    border border-slate-500 dark:border-slate-500 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500/40 dark:focus:border-indigo-400 dark:focus:ring-indigo-400/40
  {% endif %}
  {% if disabled %}
    opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800
  {% endif %}
  {% if extra_classes %}{{ extra_classes }}{% endif %}"
>{% if value %}{{ value }}{% endif %}</textarea>
