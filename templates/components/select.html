{% comment %}
Reusable Select Component
Parameters:
  - id: string
  - name: string
  - required: boolean
  - disabled: boolean
  - error: string
  - help_text: string
  - extra_classes: string
  - options_html: raw HTML for <option> items (or passed inside block)
{% endcomment %}
<div class="relative w-full">
  <select
    id="{{ id }}"
    name="{{ name }}"
    {% if required %}required{% endif %}
    {% if disabled %}disabled aria-disabled="true"{% endif %}
    {% if error %}
      aria-invalid="true"
      aria-describedby="{{ id }}-error{% if help_text %} {{ id }}-help{% endif %}"
    {% elif help_text %}
      aria-describedby="{{ id }}-help"
    {% endif %}
    class="w-full appearance-none px-3.5 py-2.5 pr-10 rounded-xl text-sm min-h-[44px] transition-all duration-150 outline-none shadow-sm cursor-pointer
    bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100
    {% if error %}
      border-2 border-red-500 dark:border-red-500 focus:border-red-500 focus:ring-2 focus:ring-red-500/30
    {% else %}
      border border-slate-500 dark:border-slate-500 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500/40 dark:focus:border-indigo-400 dark:focus:ring-indigo-400/40
    {% endif %}
    {% if disabled %}
      opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800
    {% endif %}
    {% if extra_classes %}{{ extra_classes }}{% endif %}"
  >
    {{ options_html|safe }}
  </select>
  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 dark:text-slate-400" aria-hidden="true">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
</div>
