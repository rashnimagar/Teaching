{% extends "base.html" %}

{% block title %}500 Server Error — Teaching Platform{% endblock title %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center py-12">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 font-extrabold text-2xl mb-6">
      500
    </div>
    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Unexpected Error</h1>
    <p class="mt-4 text-sm text-gray-500 dark:text-gray-400">
      Something went wrong on our end while processing your request. Our team has been notified.
    </p>
    <div class="mt-8 flex justify-center gap-4">
      <a href="{% url 'core:home' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Return Home
      </a>
    </div>
  </div>
</div>
{% endblock content %}
