{% if messages %}
  <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full" role="region" aria-label="Notifications">
    {% for message in messages %}
      <div 
        class="flex items-center justify-between p-4 rounded-lg shadow-lg border text-sm transition-all duration-300
          {% if message.tags == 'error' %}
            bg-red-50 text-red-900 border-red-200 dark:bg-red-900/30 dark:text-red-200 dark:border-red-800
          {% elif message.tags == 'success' %}
            bg-emerald-50 text-emerald-900 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-200 dark:border-emerald-800
          {% elif message.tags == 'warning' %}
            bg-amber-50 text-amber-900 border-amber-200 dark:bg-amber-900/30 dark:text-amber-200 dark:border-amber-800
          {% else %}
            bg-blue-50 text-blue-900 border-blue-200 dark:bg-blue-900/30 dark:text-blue-200 dark:border-blue-800
          {% endif %}"
        role="alert"
      >
        <div class="flex items-center gap-2">
          <span>{{ message }}</span>
        </div>
        <button 
          type="button" 
          data-dismiss="alert" 
          class="ml-3 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white p-1 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          aria-label="Close notification"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
